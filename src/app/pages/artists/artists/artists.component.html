<p-toast></p-toast>
<p-confirmDialog #cd [breakpoints]="{'960px': '75vw', '640px': '100vw'}" [style]="{width: '30vw'}">
  <ng-template pTemplate="header">
      <h3>Exclusão de Artista</h3>
  </ng-template>
  <ng-template pTemplate="footer">
      <button type="button" pButton class="cd-btn-cancel" icon="pi pi-times" label="Cancelar" (click)="cd.reject()"></button>
      <button type="button" pButton class="cd-btn-remove" icon="pi pi-trash" label="Remover" (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>

<div class="artists-container">
  <div class="header-section">
    <div class="header-content">
      <div class="header-left">
        <h1 class="page-title">Artistas</h1>
        <p class="page-subtitle">Gerencie os artistas da sua coleção</p>
      </div>
      <div class="header-right">
        <button pButton
                label="Novo Artista"
                icon="pi pi-plus"
                routerLink="/artists/create"
                class="p-button-success add-button">
        </button>
      </div>
    </div>
  </div>

  <div class="content-section">
    <div *ngIf="artists$ | async as artists; else loading">
      <div class="artists-grid">
        <div *ngFor="let artist of artists" class="artist-card">
          <div class="card-header">
            <div class="artist-icon">
              <i class="pi pi-users"></i>
            </div>
            <h3 class="artist-name">{{artist.name}}</h3>
          </div>
          <div class="card-body">
            <div class="artist-info">
              <div class="info-item">
                <i class="pi pi-map-marker"></i>
                <span>{{artist.country}}</span>
              </div>
            </div>
          </div>
          <div class="card-actions">
            <button pButton
                    type="button"
                    icon="pi pi-pencil"
                    label="Editar"
                    class="p-button-outlined p-button-info"
                    routerLink="/artists/form/{{artist.id || artist._id}}">
            </button>
            <button pButton
                    type="button"
                    icon="pi pi-trash"
                    class="p-button-outlined p-button-danger"
                    (click)="delete(artist)">
            </button>
          </div>
        </div>
      </div>
    </div>

    <ng-template #loading>
      <div class="loading-spinner">
        <p-progressSpinner></p-progressSpinner>
      </div>
    </ng-template>
  </div>
</div>
