<p-toast></p-toast>
<p-confirmDialog #cd [breakpoints]="{'960px': '75vw', '640px': '100vw'}" [style]="{width: '30vw'}">
  <ng-template pTemplate="header">
      <h3>Exclusão de Categoria</h3>
  </ng-template>
  <ng-template pTemplate="footer">
      <button type="button" pButton class="cd-btn-cancel" icon="pi pi-times" label="Cancelar" (click)="cd.reject()"></button>
      <button type="button" pButton class="cd-btn-remove" icon="pi pi-trash" label="Remover" (click)="cd.accept()"></button>
  </ng-template>
</p-confirmDialog>

<div class="categories-container">
  <div class="header-section">
    <div class="header-content">
      <div class="header-left">
        <h1 class="page-title">Categorias</h1>
        <p class="page-subtitle">Organize sua coleção por categorias</p>
      </div>
      <div class="header-right">
        <button pButton
                label="Nova Categoria"
                icon="pi pi-plus"
                routerLink="/categorias/create"
                class="p-button-success add-button">
        </button>
      </div>
    </div>
  </div>

  <div class="content-section">
    <div *ngIf="categorias$ | async as categorias; else loading">
      <div class="categories-grid">
        <div *ngFor="let categoria of categorias" class="category-card">
          <div class="card-icon">
            <i class="pi pi-tag"></i>
          </div>
          <div class="card-content">
            <h3 class="category-name">{{ categoria.name }}</h3>
          </div>
          <div class="card-actions">
            <button pButton
                    type="button"
                    icon="pi pi-trash"
                    label="Excluir"
                    class="p-button-outlined p-button-danger delete-btn"
                    (click)="delete(categoria)">
            </button>
          </div>
        </div>
      </div>
    </div>

    <ng-template #loading>
      <div class="loading-spinner">
        <p-progressSpinner></p-progressSpinner>
      </div>
    </ng-template>
  </div>
</div>
